      Developed cross-platform mobile applications for both Android and iOS using Flutter framework.


personal_projects:
  - image_light: aura_home.png
    image_dark: aura_home.png
    description: >
      [Aura](https://aura-umber-seven.vercel.app/) is a vibe-based restaurant and bar discovery PWA for Nairobi locals. The platform filters venues by ambience (intimate, energetic, chill, etc.), pricing, proximity, and social context, solving the "where should we go?" problem with real-time signals instead of stale reviews.

      Built with React, Tailwind CSS, and Supabase. Deployed to Vercel.

  - image_light: foleni_home.png
    image_dark: foleni_home.png
    description: >
      [Foleni](https://foleni-sable.vercel.app/) is a virtual queue management PWA for clinics, government offices, and service businesses across East Africa. It replaces physical waiting rooms with a live digital queue — patients join via QR code, track their position in real time, and get notified when their turn is near.

      Built with Next.js, NestJS, PostgreSQL, and Socket.io. Deployed on Vercel and Railway with real-time WebSocket updates, SMS notifications via Africa's Talking, and a multi-tenant architecture supporting multiple branches per business.      